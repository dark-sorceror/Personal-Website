name: Deploy to GitHub Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # The past versions under /history/ are built from old commits
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Restore Next.js build cache
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*', 'app/**/*', 'pages/**/*', 'public/**/*', 'next.config.*') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            # Past versions never change, so each is built once and kept in
            # the cache. A new history.json entry misses the exact key, falls
            # back to the last cache, and only the new version gets built.
            # They come before the site's build, which hashes their
            # screenshots into /history/'s image URLs.
            - name: Restore past versions
              id: history-cache
              uses: actions/cache@v4
              with:
                  path: .history-cache
                  key: ${{ runner.os }}-history-${{ hashFiles('history.json', 'scripts/history/**') }}
                  restore-keys: |
                      ${{ runner.os }}-history-

            # Only new versions need it. The live site's screenshots, taken
            # on every deploy, fall back to the Chrome the runner comes with.
            - name: Install Chromium for thumbnails
              if: steps.history-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              continue-on-error: true

            # No webhook here: the Build step's env doesn't reach these, and
            # the script strips any that would. A version that fails to build
            # is skipped, and nothing here can stop the deploy.
            - name: Build past versions
              run: node scripts/history/build.mjs
              continue-on-error: true

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_DISCORD_WEBHOOK_URL: ${{ secrets.VITE_DISCORD_WEBHOOK_URL }}

            # The live site, built with the webhook, is screenshotted with
            # requests to other sites refused, so the visit log can't fire
            - name: Add past versions
              run: node scripts/history/build.mjs --out out --no-build
              continue-on-error: true

            - name: Add .nojekyll
              run: touch out/.nojekyll

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./out

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
