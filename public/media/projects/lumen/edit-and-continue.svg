<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc"><title id="title">Lumen edit-and-continue workflow</title><desc id="desc">Edit an event-sourced context, preview the cache invalidation cost, preserve the common prefix, re-prefill the changed suffix, and resume generation.</desc><rect width="1200" height="700" fill="#141414"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="62" y="75" font-size="21" letter-spacing="3" fill="#a0a0a5">LUMEN / EDIT AND CONTINUE</text><text x="62" y="153" font-size="44" fill="#f1f1f2">Change the context. Keep the useful state.</text>
<g font-size="22" fill="#f1f1f2"><rect x="62" y="220" width="322" height="122" rx="8" fill="#1c1c1d" stroke="#45454b"/><text x="87" y="258" fill="#e2e2e7" font-size="17">01 / EDIT</text><text x="87" y="300">Update a context segment</text><rect x="438" y="220" width="322" height="122" rx="8" fill="#1c1c1d" stroke="#45454b"/><text x="463" y="258" fill="#e2e2e7" font-size="17">02 / PREVIEW</text><text x="463" y="300">Inspect re-prefill cost</text><rect x="814" y="220" width="322" height="122" rx="8" fill="#2d2d33" stroke="#e2e2e7"/><text x="839" y="258" fill="#e2e2e7" font-size="17">03 / CONTINUE</text><text x="839" y="300">Resume generation</text></g>
<path d="M384 281H438M760 281H814" stroke="#e2e2e7" stroke-width="2"/><text x="62" y="412" fill="#a0a0a5" font-size="18" letter-spacing="2">KV CACHE</text><rect x="62" y="446" width="605" height="64" rx="5" fill="#e2e2e7"/><rect x="679" y="446" width="457" height="64" rx="5" fill="#29292e" stroke="#696970" stroke-dasharray="7 6"/><text x="86" y="486" font-size="24" fill="#1b1b1d">Common prefix · preserved</text><text x="703" y="486" font-size="24" fill="#e2e2e7">Changed suffix · re-prefilled</text><text x="62" y="565" font-size="22" fill="#b3b3ba">Segment-aligned tokenization over an event-sourced context.</text><text x="1135" y="637" text-anchor="end" fill="#e2e2e7" font-size="20">02 / 02</text></g></svg>
